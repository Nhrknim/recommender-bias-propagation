name: Auto Issue PR to Upstream

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_PR_PAT || secrets.GITHUB_TOKEN }}

      - name: Prepare Clean Branch Without .github
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or reset upstream-sync branch matching main
          git checkout -B upstream-sync

          # Remove .github folder so it never reaches upstream
          if [ -d ".github" ]; then
            git rm -rf .github
            git commit -m "chore: strip .github workflows for upstream PR" || echo "No changes to commit"
          fi

          # Push clean branch to fork
          git push -f origin upstream-sync

      - name: Check and Create Pull Request to Upstream
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_REPO="Nhrknim/recommender-bias-propagation"
          HEAD_BRANCH="Unknown-Geek:upstream-sync"
          BASE_BRANCH="main"

          echo "Checking for existing open PR from $HEAD_BRANCH to $UPSTREAM_REPO..."
          EXISTING_PR=$(gh pr list --repo "$UPSTREAM_REPO" --head "$HEAD_BRANCH" --state open --json number -q '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "A pull request (#$EXISTING_PR) is already open in $UPSTREAM_REPO. GitHub automatically updates it with latest commits."
            exit 0
          fi

          # Check if there are actual new commits and changed files to submit
          echo "Checking if $HEAD_BRANCH has new commits and changed files compared to $UPSTREAM_REPO:$BASE_BRANCH..."
          COMPARE_JSON=$(gh api "repos/$UPSTREAM_REPO/compare/$BASE_BRANCH...$HEAD_BRANCH" 2>/dev/null || echo "{}")
          AHEAD_COUNT=$(echo "$COMPARE_JSON" | jq -r '.ahead_by // 0')
          FILES_COUNT=$(echo "$COMPARE_JSON" | jq -r '(.files // []) | length')
          echo "Commits ahead: $AHEAD_COUNT, Files changed: $FILES_COUNT"

          if [ "$AHEAD_COUNT" -eq 0 ] || [ "$FILES_COUNT" -eq 0 ]; then
            echo "Upstream is already fully up to date with $HEAD_BRANCH (or changes are fork-only). No new files to submit in a PR."
            exit 0
          fi

          echo "Found $AHEAD_COUNT new commit(s) with $FILES_COUNT changed file(s). Creating a new PR to $UPSTREAM_REPO..."
          gh pr create \
            --repo "$UPSTREAM_REPO" \
            --head "$HEAD_BRANCH" \
            --base "$BASE_BRANCH" \
            --title "feat: closed-loop bias propagation benchmark, 32-D geometry, and t-SNE visual suite" \
            --body "Automated PR from fork containing closed-loop simulation suite, Cornac adapters, quantitative 32-D embedding drift metrics, and research documentation."
