name: Auto Issue PR to Upstream

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check and Create Pull Request to Upstream
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_REPO="Nhrknim/recommender-bias-propagation"
          HEAD_BRANCH="Unknown-Geek:main"
          BASE_BRANCH="main"

          echo "Checking for existing open PR from $HEAD_BRANCH to $UPSTREAM_REPO..."
          EXISTING_PR=$(gh pr list --repo "$UPSTREAM_REPO" --head "$HEAD_BRANCH" --state open --json number -q '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "A pull request (#$EXISTING_PR) is already open in $UPSTREAM_REPO. GitHub automatically updates it with your latest commits."
          else
            echo "No open PR found. Creating a new PR to $UPSTREAM_REPO..."
            gh pr create \
              --repo "$UPSTREAM_REPO" \
              --head "$HEAD_BRANCH" \
              --base "$BASE_BRANCH" \
              --title "feat: closed-loop bias propagation benchmark, 32-D geometry, and t-SNE visual suite" \
              --body "Automated PR from fork containing closed-loop simulation suite, Cornac adapters, quantitative 32-D embedding drift metrics, and research documentation."
          fi
